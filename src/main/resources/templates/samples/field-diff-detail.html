<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字段差异明细</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="shell layout-frame">
  <div th:replace="~{fragments/layout :: topbar(${active})}"></div>
  <div class="page-head">
    <div><div class="eyebrow">Field Diff Detail</div><h1>字段差异明细</h1></div>
    <a class="btn" href="/samples/field-diffs">返回列表</a>
  </div>

  <section class="panel detail-grid">
    <div><span>业务日期</span><strong th:text="${row.origCdate()}"></strong></div>
    <div><span>批次号</span><strong th:text="${row.batchId()}"></strong></div>
    <div><span>交易码</span><strong th:text="${row.tranCode()}"></strong></div>
    <div><span>服务码</span><strong th:text="${row.serviceCode()}"></strong></div>
    <div><span>报文类型</span><strong th:text="${row.messageType()}"></strong></div>
    <div><span>责任人</span><strong th:text="${row.owner()}"></strong></div>
    <div><span>影响交易笔数</span><strong th:text="${row.affectedTranCount()}"></strong></div>
    <div><span>映射状态</span><strong th:text="${row.mappingStatus()}"></strong></div>
  </section>

  <section class="panel detail-grid">
    <div><span>SOP字段名</span><strong th:text="${row.sopFieldName()}"></strong></div>
    <div><span>SOAP字段名</span><strong th:text="${row.soapFieldName()}"></strong></div>
    <div><span>BizJSON字段名</span><strong th:text="${row.bizjsonFieldName()}"></strong></div>
    <div><span>字段中文名</span><strong th:text="${row.fieldCnName()}"></strong></div>
    <div><span>样例流水号</span><strong th:text="${row.sampleTranSeqNo()}"></strong></div>
  </section>

  <section class="panel compare-grid">
    <div>
      <h2>528值</h2>
      <pre th:text="${row.origFieldValue()}"></pre>
    </div>
    <div>
      <h2>CCBS值</h2>
      <pre th:text="${row.destFieldValue()}"></pre>
    </div>
  </section>
</main>
</body>
</html>
