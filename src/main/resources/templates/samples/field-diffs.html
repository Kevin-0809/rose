<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字段级差异</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="shell layout-frame">
  <div th:replace="~{fragments/layout :: topbar(${active})}"></div>
  <div class="page-head"><div><div class="eyebrow">Field Diffs</div><h1>字段级差异</h1></div></div>
  <form class="panel filters" method="get">
    <div class="filter-grid">
      <div><label>批次</label><input name="batchId" th:value="${criteria.batchId()}"></div>
      <div><label>业务日期</label><input name="origCdate" th:value="${criteria.origCdate()}"></div>
      <div><label>交易码</label><input name="tranCode" th:value="${criteria.tranCode()}"></div>
      <div><label>服务码</label><input name="serviceCode" th:value="${criteria.serviceCode()}"></div>
      <div><label>报文类型</label><input name="messageType" th:value="${criteria.messageType()}"></div>
      <div><label>配置状态</label><input name="configStatus" th:value="${criteria.configStatus()}"></div>
      <div><label>映射状态</label><input name="mappingStatus" th:value="${criteria.mappingStatus()}"></div>
      <div><label>字段名</label><input name="semanticFieldName" th:value="${criteria.semanticFieldName()}"></div>
      <div><label>流水号</label><input name="tranSeqNo" th:value="${criteria.tranSeqNo()}"></div>
      <div><label>责任人</label><input name="owner" th:value="${criteria.owner()}"></div>
      <div class="actions"><button class="btn primary" type="submit">查询</button><button class="btn" type="submit" formaction="/samples/field-diffs/export">导出Excel</button><a class="btn" href="/samples/field-diffs">重置</a></div>
    </div>
    <div th:replace="~{fragments/layout :: pager(${result})}"></div>
  </form>
  <section class="panel table-wrap table-wrap-wide">
    <table class="table-compact field-diff-table">
      <thead><tr><th class="col-date">业务日期</th><th class="col-batch">批次号</th><th class="col-code">交易码</th><th class="col-service">服务码</th><th class="col-type">报文类型</th><th class="col-field-list">SOP字段名</th><th class="col-field-list">SOAP字段名</th><th class="col-field-list">BizJSON字段名</th><th class="col-field-cn">字段中文名</th><th class="col-status">映射状态</th><th class="col-seq">样例流水号</th><th class="col-value">528值</th><th class="col-value">CCBS值</th><th class="col-owner">责任人</th><th class="col-count">影响交易笔数</th></tr></thead>
      <tbody>
      <tr th:each="row : ${result.rows()}">
        <td class="col-date" th:text="${row.origCdate()}"></td>
        <td class="col-batch" th:text="${row.batchId()}" th:title="${row.batchId()}"></td>
        <td class="col-code" th:text="${row.tranCode()}"></td>
        <td class="col-service" th:text="${row.serviceCode()}" th:title="${row.serviceCode()}"></td>
        <td class="col-type" th:text="${row.messageType()}"></td>
        <td class="col-field-list" th:text="${row.sopFieldName()}" th:title="${row.sopFieldName()}"></td>
        <td class="col-field-list" th:text="${row.soapFieldName()}" th:title="${row.soapFieldName()}"></td>
        <td class="col-field-list" th:text="${row.bizjsonFieldName()}" th:title="${row.bizjsonFieldName()}"></td>
        <td class="col-field-cn" th:text="${row.fieldCnName()}" th:title="${row.fieldCnName()}"></td>
        <td class="col-status"><span class="tag" th:text="${row.mappingStatus() == 'MAPPED' ? '已映射' : (row.mappingStatus() == 'UNMAPPED' ? '未映射' : (row.mappingStatus() == 'MIXED' ? '混合' : row.mappingStatus()))}"></span></td>
        <td class="col-seq" th:text="${row.sampleTranSeqNo()}" th:title="${row.sampleTranSeqNo()}"></td>
        <td class="col-value" th:text="${row.origFieldValue()}" th:title="${row.origFieldValue()}"></td>
        <td class="col-value" th:text="${row.destFieldValue()}" th:title="${row.destFieldValue()}"></td>
        <td class="col-owner" th:text="${row.owner()}"></td>
        <td class="col-count" th:text="${row.affectedTranCount()}"></td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
</body>
</html>
