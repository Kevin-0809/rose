<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字段级差异</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-shell" th:attr="data-active=${active}">
  <div th:replace="~{fragments/layout :: sidebar(${active})}"></div>
  <div class="app-workspace">
    <div th:replace="~{fragments/layout :: workspaceBar}"></div>
    <main class="shell layout-frame">
  <div class="page-head"><div><div class="eyebrow">Field Diffs</div><h1>字段级差异</h1></div></div>
  <form class="panel filters" method="get">
    <div class="filter-grid">
      <div><label>批次</label><input name="batchId" th:value="${criteria.batchId()}"></div>
      <div><label>业务日期</label><input name="origCdate" th:value="${criteria.origCdate()}"></div>
      <div><label>交易码</label><input name="tranCode" th:value="${criteria.tranCode()}"></div>
      <div><label>服务码</label><input name="serviceCode" th:value="${criteria.serviceCode()}"></div>
      <div><label>报文类型</label><input name="messageType" th:value="${criteria.messageType()}"></div>
      <div><label>配置状态</label><input name="configStatus" th:value="${criteria.configStatus()}"></div>
      <div><label>映射状态</label><input name="mappingStatus" th:value="${criteria.mappingStatus()}"></div>
      <div><label>字段名</label><input name="semanticFieldName" th:value="${criteria.semanticFieldName()}"></div>
      <div><label>流水号</label><input name="tranSeqNo" th:value="${criteria.tranSeqNo()}"></div>
      <div><label>责任人</label><input name="owner" th:value="${criteria.owner()}"></div>
      <div class="actions"><button class="btn primary" type="submit">查询</button><button class="btn" type="submit" formaction="/samples/field-diffs/export">导出ZIP</button><button class="btn" type="submit" formaction="/samples/field-diffs/tracking-export" data-field-tracking-export>导出问题跟踪表</button><a class="btn" href="/samples/field-diffs">重置</a></div>
    </div>
    <div th:replace="~{fragments/layout :: pager(${result})}"></div>
  </form>
  <section class="panel table-wrap table-wrap-wide field-diff-table-wrap">
    <table class="table-compact field-diff-table" data-field-diff-table>
      <thead><tr><th class="col-date">业务日期</th><th class="col-batch">批次号</th><th class="col-code">交易码</th><th class="col-service">服务码</th><th class="col-type">报文类型</th><th class="col-field-list">SOP字段名</th><th class="col-field-list">SOAP字段名</th><th class="col-field-list">BizJSON字段名</th><th class="col-field-cn">字段中文名</th><th class="col-status">映射状态</th><th class="col-seq">样例流水号</th><th class="col-value">528值</th><th class="col-value">CCBS值</th><th class="col-owner">责任人</th><th class="col-count">影响交易笔数</th></tr></thead>
      <tbody>
      <tr class="field-diff-row" th:each="row : ${result.rows()}" title="双击查看完整行数据">
        <td class="col-date" data-detail-label="业务日期" th:text="${row.origCdate()}"></td>
        <td class="col-batch" data-detail-label="批次号" th:text="${row.batchId()}" th:title="${row.batchId()}"></td>
        <td class="col-code" data-detail-label="交易码" th:text="${row.tranCode()}"></td>
        <td class="col-service" data-detail-label="服务码" th:text="${row.serviceCode()}" th:title="${row.serviceCode()}"></td>
        <td class="col-type" data-detail-label="报文类型" th:text="${row.messageType()}"></td>
        <td class="col-field-list" data-detail-label="SOP字段名" th:title="${row.sopFieldName()}"><span class="cell-clip" th:text="${row.sopFieldName()}"></span></td>
        <td class="col-field-list" data-detail-label="SOAP字段名" th:title="${row.soapFieldName()}"><span class="cell-clip" th:text="${row.soapFieldName()}"></span></td>
        <td class="col-field-list" data-detail-label="BizJSON字段名" th:title="${row.bizjsonFieldName()}"><span class="cell-clip" th:text="${row.bizjsonFieldName()}"></span></td>
        <td class="col-field-cn" data-detail-label="字段中文名" th:title="${row.fieldCnName()}"><span class="cell-clip" th:text="${row.fieldCnName()}"></span></td>
        <td class="col-status" data-detail-label="映射状态"><span class="tag" th:text="${row.mappingStatus() == 'MAPPED' ? '已映射' : (row.mappingStatus() == 'UNMAPPED' ? '未映射' : (row.mappingStatus() == 'MIXED' ? '混合' : row.mappingStatus()))}"></span></td>
        <td class="col-seq" data-detail-label="样例流水号" th:title="${row.sampleTranSeqNo()}"><span class="cell-clip" th:text="${row.sampleTranSeqNo()}"></span></td>
        <td class="col-value" data-detail-label="528值" th:title="${row.origFieldValue()}"><span class="cell-clip" th:text="${row.origFieldValue()}"></span></td>
        <td class="col-value" data-detail-label="CCBS值" th:title="${row.destFieldValue()}"><span class="cell-clip" th:text="${row.destFieldValue()}"></span></td>
        <td class="col-owner" data-detail-label="责任人" th:text="${row.owner()}"></td>
        <td class="col-count" data-detail-label="影响交易笔数" th:text="${row.affectedTranCount()}"></td>
      </tr>
      </tbody>
    </table>
  </section>
  <dialog class="detail-dialog" id="fieldDiffDialog" aria-labelledby="fieldDiffDialogTitle">
    <form method="dialog">
      <div class="detail-dialog-head">
        <h2 id="fieldDiffDialogTitle">字段级差异详情</h2>
        <button class="btn small" type="submit">关闭</button>
      </div>
      <dl class="detail-list" id="fieldDiffDetailList"></dl>
    </form>
  </dialog>
</main>
  </div>
</div>
<div th:replace="~{fragments/layout :: sidebarScript}"></div>
<script>
  document.querySelector('[data-field-tracking-export]')?.addEventListener('click', function (event) {
    const batchId = this.form.querySelector('[name="batchId"]');
    if (!batchId.value.trim()) {
      event.preventDefault();
      window.alert('请选择批次后导出');
      batchId.focus();
    }
  });

  (() => {
    const table = document.querySelector('[data-field-diff-table]');
    const dialog = document.getElementById('fieldDiffDialog');
    const detailList = document.getElementById('fieldDiffDetailList');
    if (!table || !dialog || !detailList) {
      return;
    }

    table.addEventListener('dblclick', (event) => {
      const row = event.target.closest('.field-diff-row');
      if (!row) {
        return;
      }

      detailList.replaceChildren();
      row.querySelectorAll('[data-detail-label]').forEach((cell) => {
        const label = document.createElement('dt');
        const value = document.createElement('dd');
        label.textContent = cell.dataset.detailLabel;
        value.textContent = cell.textContent.trim() || '-';
        detailList.append(label, value);
      });

      dialog.showModal();
    });
  })();
</script>
</body>
</html>
