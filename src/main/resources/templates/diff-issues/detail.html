<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>维护问题</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="app-shell" th:attr="data-active=${active}"><div th:replace="~{fragments/layout :: sidebar(${active})}"></div><div class="app-workspace"><div th:replace="~{fragments/layout :: workspaceBar}"></div><main class="shell layout-frame"><div class="page-head"><h1>维护问题</h1><a class="btn" href="/diff-issues">返回</a></div><p th:if="${error}" th:text="${error}"></p><form class="panel form-grid" method="post" th:action="@{/diff-issues/{id}(id=${issue.issueId()})}"><input type="hidden" name="updatedAt" th:value="${issue.updatedAt()}"><div><label>问题键</label><input readonly th:value="${issue.issueKey()}"></div><div><label>状态</label><select name="issueStatus"><option value="OPEN" th:selected="${issue.issueStatus() == 'OPEN'}">未解决</option><option value="RESOLVED" th:selected="${issue.issueStatus() == 'RESOLVED'}">已解决</option><option value="IGNORED" th:selected="${issue.issueStatus() == 'IGNORED'}">忽略</option></select></div><div><label>问题类型</label><input name="problemType" th:value="${issue.problemType()}"></div><div><label>解决人</label><input name="resolver" th:value="${issue.resolver()}"></div><div class="span-2"><label>初步分析</label><textarea name="preliminaryAnalysis" th:text="${issue.preliminaryAnalysis()}"></textarea></div><div class="span-2"><label>最终方案</label><textarea name="finalSolution" th:text="${issue.finalSolution()}"></textarea></div><div><label>解决日期</label><input type="date" name="resolutionDate" th:value="${issue.resolutionDate()}"></div><div><label>缺陷修复日期</label><input type="date" name="defectFixDate" th:value="${issue.defectFixDate()}"></div><button class="btn primary" type="submit">保存</button></form></main></div></div></body></html>
