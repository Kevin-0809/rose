<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>维护差异问题</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-shell" th:attr="data-active=${active}">
  <div th:replace="~{fragments/layout :: sidebar(${active})}"></div>
  <div class="app-workspace">
    <div th:replace="~{fragments/layout :: workspaceBar}"></div>
    <main class="shell layout-frame issue-detail-page">
      <div class="page-head issue-page-head">
        <div>
          <div class="eyebrow">Issue Maintenance</div>
          <h1>维护差异问题</h1>
          <p class="muted issue-key-line" th:text="${issue.issueKey()}"></p>
        </div>
        <a class="btn" href="/diff-issues">返回台账</a>
      </div>

      <div class="tag green" th:if="${message}" th:text="${message}"></div>
      <div class="tag yellow" th:if="${error}" th:text="${error}"></div>

      <section class="panel issue-readonly-panel">
        <div class="issue-section-head">
          <h2>问题快照</h2>
          <span class="muted">本区域来自当前采集批次，仅用于定位问题。</span>
        </div>
        <div class="issue-info-grid">
          <label>问题级别<input readonly th:value="${issue.issueLevel()}"></label>
          <label>状态<input readonly th:value="${issue.issueStatus()}"></label>
          <label>服务码<input readonly th:value="${issue.serviceCode()}"></label>
          <label>领域<input readonly th:value="${issue.moduleName()}"></label>
          <label>交易码<input readonly th:value="${issue.tranCode()}"></label>
          <label>交易名称<input readonly th:value="${issue.tranName()}"></label>
          <label>字段名<input readonly th:value="${issue.normalizedSourceFieldName()}"></label>
          <label>交易负责人<input readonly th:value="${issue.transactionOwner()}"></label>
          <label>出现批次数<input readonly th:value="${issue.occurrenceBatchCount()}"></label>
          <label>首次出现日期<input readonly th:value="${issue.firstSeenDate()}"></label>
          <label>最近出现日期<input readonly th:value="${issue.lastSeenDate()}"></label>
          <label>最近批次<input readonly th:value="${issue.lastSeenBatchId()}"></label>
          <label class="issue-field-full">问题描述<textarea readonly th:text="${issue.problemDescription()}"></textarea></label>
        </div>
      </section>

      <form class="panel issue-maintenance-panel" method="post" th:action="@{/diff-issues/{id}(id=${issue.issueId()})}">
        <input type="hidden" name="updatedAt" th:value="${issue.updatedAt()}">
        <div class="issue-section-head">
          <h2>处理信息</h2>
          <span class="muted">保存后会在后续采集批次中带入。</span>
        </div>
        <div class="issue-maintenance-grid">
          <label>处理状态
            <select name="issueStatus">
              <option value="OPEN" th:selected="${issue.issueStatus() == 'OPEN'}">未解决</option>
              <option value="RESOLVED" th:selected="${issue.issueStatus() == 'RESOLVED'}">已解决</option>
              <option value="IGNORED" th:selected="${issue.issueStatus() == 'IGNORED'}">忽略</option>
            </select>
          </label>
          <label>问题类型<input name="problemType" th:value="${issue.problemType()}"></label>
          <label>解决人员<input name="resolver" th:value="${issue.resolver()}"></label>
          <label>需协同组<input name="coordinationRequired" th:value="${issue.coordinationRequired()}"></label>
          <label>解决日期<input type="date" name="resolutionDate" th:value="${issue.resolutionDate()}"></label>
          <label>缺陷修复日期<input type="date" name="defectFixDate" th:value="${issue.defectFixDate()}"></label>
          <label class="issue-field-half">初步问题分析<textarea name="preliminaryAnalysis" th:text="${issue.preliminaryAnalysis()}"></textarea></label>
          <label class="issue-field-half">最终处理方案<textarea name="finalSolution" th:text="${issue.finalSolution()}"></textarea></label>
        </div>
        <div class="issue-form-actions">
          <button class="btn primary" type="submit">保存</button>
        </div>
      </form>
    </main>
  </div>
</div>
<div th:replace="~{fragments/layout :: sidebarScript}"></div>
</body>
</html>
