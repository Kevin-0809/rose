<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>问题台账</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="app-shell" th:attr="data-active=${active}"><div th:replace="~{fragments/layout :: sidebar(${active})}"></div><div class="app-workspace"><div th:replace="~{fragments/layout :: workspaceBar}"></div><main class="shell layout-frame"><div class="page-head"><h1>问题台账</h1></div><form class="panel filters"><input name="serviceCode" placeholder="服务码" th:value="${serviceCode}"><input name="keyword" placeholder="问题键或描述" th:value="${keyword}"><select name="issueLevel"><option value="">全部级别</option><option value="TRANSACTION">交易级</option><option value="FIELD">字段级</option></select><select name="issueStatus"><option value="">全部状态</option><option value="OPEN">未解决</option><option value="RESOLVED">已解决</option></select><button class="btn primary">查询</button></form><section class="panel table-wrap"><table><thead><tr><th>级别</th><th>服务码</th><th>问题键</th><th>状态</th><th>出现批次</th><th>首次出现</th><th>最近出现</th><th></th></tr></thead><tbody><tr th:each="row:${rows}"><td th:text="${row.issueLevel()}"></td><td th:text="${row.serviceCode()}"></td><td th:text="${row.issueKey()}"></td><td th:text="${row.issueStatus()}"></td><td th:text="${row.occurrenceBatchCount()}"></td><td th:text="${row.firstSeenDate()}"></td><td th:text="${row.lastSeenDate()}"></td><td><a class="btn" th:href="@{/diff-issues/{id}(id=${row.issueId()})}">维护</a></td></tr></tbody></table></section></main></div></div><div th:replace="~{fragments/layout :: sidebarScript}"></div></body></html>
