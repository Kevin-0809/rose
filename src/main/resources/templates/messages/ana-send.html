<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>报文发送</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="app-shell" th:attr="data-active=${active}"><div th:replace="~{fragments/layout :: sidebar(${active})}"></div><div class="app-workspace"><div th:replace="~{fragments/layout :: workspaceBar}"></div><main class="shell layout-frame"><div class="page-head"><div><div class="eyebrow">Request delivery</div><h1>报文发送</h1><p class="muted">从 ana_msg_flow_log_request 发送二进制报文并保存响应。</p></div></div><section class="panel"><form class="filter-grid" method="post" action="/messages/ana-send/start"><label>目标系统<select name="target"><option>528</option><option>ccbs</option></select></label><label>并发度<input name="concurrency" type="number" min="1" value="1"></label><label>批量领取<input name="batch" type="number" min="1" value="100"></label><label>最大重试<input name="retries" type="number" min="0" value="2"></label><label>超时秒数<input name="timeout" type="number" min="1" value="15"></label><div class="actions"><button class="btn primary" type="submit">启动发送</button></div></form></section><section class="summary-grid"><div><span>待发送</span><strong th:text="${stats.pending}">0</strong></div><div><span>发送中</span><strong th:text="${stats.sending}">0</strong></div><div><span>成功</span><strong th:text="${stats.success}">0</strong></div><div><span>失败</span><strong th:text="${stats.failed}">0</strong></div></section><form method="post" action="/messages/ana-send/stop"><button class="btn danger" type="submit">停止领取</button></form></main></div></div><div th:replace="~{fragments/layout :: sidebarScript}"></div></body></html>
