<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>回放交易量检查详情</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="app-shell" th:attr="data-active=${active}"><div th:replace="~{fragments/layout :: sidebar(${active})}"></div><div class="app-workspace"><div th:replace="~{fragments/layout :: workspaceBar}"></div><main class="shell layout-frame"><h1>检查批次详情</h1><p>N=<span th:text="${batch.sampleSize()}"></span>，最近 30 个自然日</p><div class="summary-grid"><span>清单交易码数：<b th:text="${batch.catalogCount()}"></b></span><span>有交易量交易数：<b th:text="${batch.hasVolumeCount()}"></b></span><span>无交易量：<b th:text="${batch.noVolumeCount()}"></b></span><span>待清理服务码：<b th:text="${batch.cleanupServiceCount()}"></b></span><span>待清理流水：<b th:text="${batch.cleanupRowCount()}"></b></span><span>状态：<b th:text="${batch.status()}"></b></span><span>migration command id：<b th:text="${batch.migrationCommandId()}"></b></span></div><h2>无交易量</h2><div th:each="r:${noVolumeDetails.rows()}"><span th:text="${r.tranCode()}"></span><span th:text="${r.tranName()}"></span><span th:text="${r.completeVolumeCount()}"></span><span th:text="${r.status()}"></span><span th:text="${r.migrationStatus()}"></span></div><form method="get"><div th:replace="~{fragments/layout :: pagerNamed(${noVolumeDetails},'noVolumePage')}"></div></form><h2>未映射</h2><div th:each="r:${noMappingDetails.rows()}"><span th:text="${r.tranCode()}"></span><span th:text="${r.tranName()}"></span><span th:text="${r.completeVolumeCount()}"></span><span th:text="${r.status()}"></span><span th:text="${r.migrationStatus()}"></span></div><form method="get"><div th:replace="~{fragments/layout :: pagerNamed(${noMappingDetails},'noMappingPage')}"></div></form><h2>待清理</h2><div th:each="r:${cleanupDetails.rows()}"><span th:text="${r.serviceCode()}"></span><span th:text="${r.mappedTranCodes()}"></span><span th:text="${r.pendingCleanupRowCount()}"></span><span th:text="${r.actualCleanupRowCount()}"></span><span th:text="${r.status()}"></span></div><form method="get"><div th:replace="~{fragments/layout :: pagerNamed(${cleanupDetails},'cleanupPage')}"></div></form></main></div></div><div th:replace="~{fragments/layout :: sidebarScript}"></div></body></html>
