<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${pathTranCode == null ? '新增回放交易清单' : '编辑回放交易清单'}">回放交易清单</title><link rel="stylesheet" href="/css/app.css"></head>
<body><div class="app-shell" th:attr="data-active=${active}"><div th:replace="~{fragments/layout :: sidebar(${active})}"></div><div class="app-workspace"><div th:replace="~{fragments/layout :: workspaceBar}"></div><main class="shell layout-frame">
  <div class="page-head"><div><div class="eyebrow">Replay Transaction Catalog</div><h1 th:text="${pathTranCode == null ? '新增回放交易清单' : '编辑回放交易清单'}">回放交易清单</h1></div></div>
  <form class="panel form-grid" method="post" action="/config/replay-catalog" th:object="${form}"><input type="hidden" name="pathTranCode" th:value="${pathTranCode}">
    <div><label>交易码</label><input th:field="*{tranCode}" required maxlength="200" th:readonly="${pathTranCode != null}"></div><div><label>交易名称</label><input th:field="*{tranName}" maxlength="200"></div><div><label>业务领域</label><input th:field="*{businessDomain}" maxlength="200"></div><div><label>批次类型</label><select th:field="*{batchType}"><option value=""></option><option value="查询">查询</option><option value="动账">动账</option></select></div><div><label>新核心交易码</label><input th:field="*{newCoreTranCode}" maxlength="200"></div><div><label>新交易名称</label><input th:field="*{newTranName}" maxlength="200"></div><div><label>是否需要回放</label><select th:field="*{replayRequired}"><option value=""></option><option value="是">是</option><option value="否">否</option></select></div><div><label>原服务场景码</label><input th:field="*{originalServiceSceneCode}" maxlength="200"></div><div><label>新服务场景码</label><input th:field="*{newServiceSceneCode}" maxlength="200"></div><div><label>最近交易日期</label><input th:field="*{latestTransactionDate}" pattern="[0-9]{8}" maxlength="8" placeholder="yyyyMMdd"></div>
    <div class="actions"><button class="btn primary" type="submit">保存</button><a class="btn" href="/config/replay-catalog">取消</a></div>
  </form>
</main></div></div><div th:replace="~{fragments/layout :: sidebarScript}"></div></body></html>
