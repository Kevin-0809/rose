<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>回放交易量检查</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="app-shell" th:attr="data-active=${active}"><div th:replace="~{fragments/layout :: sidebar(${active})}"></div><div class="app-workspace"><div th:replace="~{fragments/layout :: workspaceBar}"></div><main class="shell layout-frame"><h1>回放交易量检查</h1><form method="post" action="/config/replay-volume-check"><label>N<input name="sampleSize" th:value="${sampleSize ?: 100}"></label><button>开始检查</button></form><p>最近 30 个自然日</p><section th:if="${currentBatch}"><div class="summary-grid"><span>清单交易码数：<b th:text="${currentBatch.catalogCount()}"></b></span><span>有交易量交易数：<b th:text="${currentBatch.hasVolumeCount()}"></b></span><span>无交易量：<b th:text="${currentBatch.noVolumeCount()}"></b></span><span>待清理服务码：<b th:text="${currentBatch.cleanupServiceCount()}"></b></span><span>待清理流水：<b th:text="${currentBatch.cleanupRowCount()}"></b></span><span>状态：<b th:text="${currentBatch.status()}"></b></span><span>migration command id：<b th:text="${currentBatch.migrationCommandId()}"></b></span></div><form method="post" th:if="${canConfirm}" th:action="@{/config/replay-volume-check/{id}/confirm(id=${currentBatch.checkId()})}"><button>确认执行</button></form></section><section th:if="${currentBatch}"><h2>无交易量</h2><div th:each="r:${noVolumeDetails.rows()}"><span th:text="${r.tranCode()}"></span><span th:text="${r.tranName()}"></span><span th:text="${r.completeVolumeCount()}"></span><span th:text="${r.status()}"></span><span th:text="${r.migrationStatus()}"></span></div><form method="get"><div th:replace="~{fragments/layout :: pagerNamed(${noVolumeDetails},'noVolumePage')}"></div></form><h2>未映射</h2><div th:each="r:${noMappingDetails.rows()}"><span th:text="${r.tranCode()}"></span><span th:text="${r.tranName()}"></span><span th:text="${r.completeVolumeCount()}"></span><span th:text="${r.status()}"></span><span th:text="${r.migrationStatus()}"></span></div><form method="get"><div th:replace="~{fragments/layout :: pagerNamed(${noMappingDetails},'noMappingPage')}"></div></form><h2>待清理</h2><div th:each="r:${cleanupDetails.rows()}"><span th:text="${r.serviceCode()}"></span><span th:text="${r.mappedTranCodes()}"></span><span th:text="${r.pendingCleanupRowCount()}"></span><span th:text="${r.actualCleanupRowCount()}"></span><span th:text="${r.status()}"></span></div><form method="get"><div th:replace="~{fragments/layout :: pagerNamed(${cleanupDetails},'cleanupPage')}"></div></form></section><section><h2>历史批次</h2><table><tr th:each="r:${history.rows()}"><td th:text="${r.checkId()}"></td><td th:text="${r.createdTime()}"></td><td th:text="${r.sampleSize()}"></td><td th:text="${r.catalogCount()}"></td><td th:text="${r.hasVolumeCount()}"></td><td th:text="${r.noVolumeCount()}"></td><td th:text="${r.cleanupServiceCount()}"></td><td th:text="${r.cleanupRowCount()}"></td><td th:text="${r.status()}"></td><td th:text="${r.migrationCommandId()}"></td><td><a th:href="@{/config/replay-volume-check/{id}(id=${r.checkId()})}">详情链接</a></td></tr></table><form method="get"><div th:replace="~{fragments/layout :: pagerNamed(${history},'historyPage')}"></div></form></section></main></div></div><div th:replace="~{fragments/layout :: sidebarScript}"></div></body></html>
