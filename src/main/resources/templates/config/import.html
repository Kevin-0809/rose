<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交易配置导入</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-shell" th:attr="data-active=${active}">
  <div th:replace="~{fragments/layout :: sidebar(${active})}"></div>
  <div class="app-workspace">
    <div th:replace="~{fragments/layout :: workspaceBar}"></div>
    <main class="shell layout-frame">
  <div class="page-head">
    <div>
      <div class="eyebrow">Config Import</div>
      <h1>交易配置导入</h1>
      <p class="muted">上传交易 Excel，一次导入交易配置和响应输出字段映射。交易服务码为空时使用服务名称编号和服务操作名称拼接。</p>
    </div>
  </div>

  <div class="panel form-grid">
    <form class="span-4 form-grid" method="post" action="/config/import/confirm" enctype="multipart/form-data">
      <div class="span-2"><label>Excel文件</label><input type="file" name="file" accept=".xlsx,.xls" multiple required></div>
      <div><label>交易服务码</label><input name="serviceCode" th:value="${serviceCode}" placeholder="为空时自动解析"></div>
      <div><label>领域</label><input name="moduleName" th:value="${moduleName}" placeholder="不填则为空"></div>
      <div><label>负责人</label><input name="owner" th:value="${owner}" placeholder="不填则为空"></div>
      <div class="actions"><button class="btn primary" type="submit">确认导入</button></div>
    </form>
  </div>

  <div class="panel form-grid">
    <form class="span-4 form-grid" method="post" action="/config/import/list" enctype="multipart/form-data">
      <div class="span-2"><label>金融业务交易信息登记表</label><input type="file" name="listFile" accept=".xlsx,.xls" required></div>
      <div class="span-2"><label>读取规则</label><input readonly class="muted-input" value="D列防腐528交易码，A列业务领域，H/I列负责人"></div>
      <div class="actions"><button class="btn primary" type="submit">清单导入</button></div>
    </form>
  </div>

  <section class="panel" th:if="${errorMessage}">
    <p class="muted" th:text="${errorMessage}"></p>
  </section>

  <section class="cards" th:if="${batchResult}">
    <div class="card"><div class="label">交易新增</div><div class="value" th:text="${batchResult.tranInserted()}">0</div></div>
    <div class="card"><div class="label">交易更新</div><div class="value" th:text="${batchResult.tranUpdated()}">0</div></div>
    <div class="card"><div class="label">字段新增</div><div class="value" th:text="${batchResult.fieldInserted()}">0</div></div>
    <div class="card"><div class="label">字段更新</div><div class="value" th:text="${batchResult.fieldUpdated()}">0</div></div>
  </section>

  <section class="cards" th:if="${listResult}">
    <div class="card"><div class="label">清单交易数</div><div class="value" th:text="${listResult.totalCount()}">0</div></div>
    <div class="card"><div class="label">请求批次</div><div class="value" th:text="${listResult.requestBatchCount()}">0</div></div>
    <div class="card"><div class="label">成功批次</div><div class="value" th:text="${listResult.successBatchCount()}">0</div></div>
    <div class="card"><div class="label">失败批次</div><div class="value" th:text="${listResult.failureBatchCount()}">0</div></div>
  </section>

  <section class="panel table-wrap" th:if="${listResult != null and !listResult.failures().isEmpty()}">
    <table>
      <thead><tr><th>失败批次</th></tr></thead>
      <tbody>
      <tr th:each="failure : ${listResult.failures()}"><td th:text="${failure}"></td></tr>
      </tbody>
    </table>
  </section>
</main>
  </div>
</div>
<div th:replace="~{fragments/layout :: sidebarScript}"></div>
</body>
</html>
