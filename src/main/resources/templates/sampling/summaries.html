<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采样统计历史</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="shell layout-frame">
  <div th:replace="~{fragments/layout :: topbar(${active})}"></div>
  <div class="page-head">
    <div>
      <div class="eyebrow">Sampling Summary</div>
      <h1>采样统计历史</h1>
      <p class="muted">按批次查看采样统计结果，并通过柱状图观察历史变化。</p>
    </div>
  </div>

  <section class="chart-band">
    <div class="section-title">
      <div>
        <div class="eyebrow">Batch Trend</div>
        <h2>最近批次柱状图</h2>
      </div>
    </div>
    <div id="summary-history-chart" class="chart chart-large"></div>
  </section>

  <form class="panel filters" method="get">
    <input type="hidden" name="page" value="1">
    <div class="filter-grid">
      <div><label>批次号</label><input name="batchId" th:value="${criteria.batchId()}"></div>
      <div><label>业务日期</label><input name="origCdate" placeholder="20260608" maxlength="8" th:value="${criteria.origCdate()}"></div>
      <div class="actions"><button class="btn primary" type="submit">查询</button><a class="btn" href="/sampling/summaries">重置</a></div>
    </div>
    <div th:replace="~{fragments/layout :: pager(${result})}"></div>
  </form>

  <section class="panel table-wrap">
    <table>
      <thead>
      <tr>
        <th>批次号</th><th>业务日期</th><th>发起交易</th><th>原失败新成功</th><th>原成功新失败</th>
        <th>都失败</th><th>都成功</th><th>响应码不一致</th><th>通过交易</th><th>交易问题</th><th>响应码问题</th><th>问题字段</th>
        <th>字段差异流水</th><th>未配置服务</th><th>未映射字段</th><th>完全匹配</th><th>分组数</th><th>明细数</th><th>创建时间</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${result.rows()}">
        <td th:text="${row.batchId()}"></td>
        <td th:text="${row.origCdate()}"></td>
        <td th:text="${row.totalTranCount()}"></td>
        <td th:text="${row.compResult1Count()}"></td>
        <td th:text="${row.compResult2Count()}"></td>
        <td th:text="${row.compResult3Count()}"></td>
        <td th:text="${row.compResult4Count()}"></td>
        <td th:text="${row.compResult8Count()}"></td>
        <td th:text="${row.passTranCount()}"></td>
        <td th:text="${row.tranIssueCount()}"></td>
        <td th:text="${row.returnCodeIssueCount()}"></td>
        <td th:text="${row.issueFieldCount()}"></td>
        <td th:text="${row.fieldDiffTranCount()}"></td>
        <td th:text="${row.unconfiguredServiceCount()}"></td>
        <td th:text="${row.unmappedFieldCount()}"></td>
        <td th:text="${row.fullyMatchedCount()}"></td>
        <td th:text="${row.sampleGroupCount()}"></td>
        <td th:text="${row.sampleDetailCount()}"></td>
        <td th:text="${row.createdAt()}"></td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
<script src="/vendor/echarts.min.js"></script>
<script th:inline="javascript">
  const summaryChartData = /*[[${summaryChart}]]*/ [];
  const summaryChartEl = document.getElementById('summary-history-chart');
  if (summaryChartEl && window.echarts) {
    const chart = echarts.init(summaryChartEl);
    const labels = summaryChartData.map(item => item.origCdate + '\n' + item.batchId.slice(-4));
    chart.setOption({
      backgroundColor: 'transparent',
      color: ['#ef4444', '#f97316', '#38bdf8', '#a855f7', '#4ade80', '#facc15', '#fb7185'],
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      legend: { top: 0, right: 0, textStyle: { color: '#8fa3ba' } },
      grid: { top: 46, left: 64, right: 28, bottom: 46 },
      xAxis: { type: 'category', data: labels, axisLabel: { color: '#8fa3ba' }, axisLine: { lineStyle: { color: 'rgba(97,128,165,.38)' } } },
      yAxis: { type: 'value', axisLabel: { color: '#8fa3ba' }, splitLine: { lineStyle: { color: 'rgba(97,128,165,.18)' } } },
      series: [
        { name: '交易问题', type: 'bar', data: summaryChartData.map(item => item.tranIssueCount), barMaxWidth: 20 },
        { name: '响应码问题', type: 'bar', data: summaryChartData.map(item => item.returnCodeIssueCount), barMaxWidth: 20 },
        { name: '问题字段', type: 'bar', data: summaryChartData.map(item => item.issueFieldCount), barMaxWidth: 20 },
        { name: '字段差异流水', type: 'bar', data: summaryChartData.map(item => item.fieldDiffTranCount), barMaxWidth: 20 },
        { name: '完全匹配', type: 'bar', data: summaryChartData.map(item => item.fullyMatchedCount), barMaxWidth: 20 },
        { name: '分组数', type: 'bar', data: summaryChartData.map(item => item.sampleGroupCount), barMaxWidth: 20 },
        { name: '明细数', type: 'bar', data: summaryChartData.map(item => item.sampleDetailCount), barMaxWidth: 20 }
      ]
    });
    window.addEventListener('resize', () => chart.resize());
  }
</script>
</body>
</html>
