<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>报表明细导出结果</title><link rel="stylesheet" href="/css/app.css"></head>
<body><div class="app-shell" th:attr="data-active=${active}"><div th:replace="~{fragments/layout :: sidebar(${active})}"></div><div class="app-workspace"><div th:replace="~{fragments/layout :: workspaceBar}"></div><main class="shell layout-frame">
  <div class="page-head"><div><div class="eyebrow">Report Detail Export</div><h1>报表明细导出结果</h1><p class="muted" th:text="${command == null ? '未找到导出任务' : command.batchId()}"></p></div><a class="btn" href="/report-exports">新建导出</a></div>
  <div class="tag green" th:if="${message}" th:text="${message}"></div>
  <section class="panel" th:if="${command != null}"><div class="page-head compact-head"><div><h2>任务状态</h2><p class="muted" th:text="${'业务日期：' + command.reportDate()}"></p></div><span id="report-export-status" class="tag" role="status" aria-live="polite" th:classappend="${command.status() == 'SUCCEEDED'} ? 'green' : (${command.status() == 'FAILED'} ? 'yellow' : '')" th:text="${command.status()}"></span></div><p class="muted" th:if="${command.errorMessage() != null}" th:text="${command.errorMessage()}"></p></section>
  <section class="panel table-wrap" th:if="${command != null and command.status() == 'SUCCEEDED'}"><h2>汇总报表</h2><table><thead><tr><th>业务日期</th><th>领域</th><th>覆盖528接口</th><th>发送交易量</th><th>528成功/CCBS失败</th><th>528失败/CCBS成功</th><th>二者均失败</th><th>二者均成功</th><th>二者均失败不一致</th><th>成功率</th><th>差异字段数</th></tr></thead><tbody><tr th:each="row : ${summaries}"><td th:text="${row.reportDate()}"></td><td th:text="${row.moduleName()}"></td><td th:text="${row.covered528InterfaceCount()}"></td><td th:text="${row.sentTransactionCount()}"></td><td th:text="${row.compResult1Count()}"></td><td th:text="${row.compResult2Count()}"></td><td th:text="${row.compResult3Count()}"></td><td th:text="${row.compResult4Count()}"></td><td th:text="${row.compResult8Count()}"></td><td th:text="${row.successRate()}"></td><td th:text="${row.diff528FieldCount()}"></td></tr></tbody></table></section>
  <section class="panel table-wrap" th:if="${command != null and command.status() == 'SUCCEEDED'}"><h2>交易级明细</h2><table><thead><tr><th>序号</th><th>服务码</th><th>原错误码</th><th>目标错误码</th><th>交易码</th><th>交易名称</th><th>领域</th><th>原错误描述</th><th>目标错误描述</th></tr></thead><tbody><tr th:each="row : ${transactionDetails}"><td th:text="${row.rowNo()}"></td><td th:text="${row.serviceCode()}"></td><td th:text="${row.origErrorCode()}"></td><td th:text="${row.destErrorCode()}"></td><td th:text="${row.tranCode()}"></td><td th:text="${row.tranName()}"></td><td th:text="${row.moduleName()}"></td><td th:text="${row.origErrorDesc()}"></td><td th:text="${row.destErrorDesc()}"></td></tr></tbody></table></section>
  <section class="panel table-wrap" th:if="${command != null and command.status() == 'SUCCEEDED'}"><h2>字段级明细</h2><table><thead><tr><th>序号</th><th>服务码</th><th>交易码</th><th>交易名称</th><th>领域</th><th>SOAP字段</th><th>问题字段</th><th>映射状态</th><th>原字段值</th><th>目标字段值</th></tr></thead><tbody><tr th:each="row : ${fieldDetails}"><td th:text="${row.rowNo()}"></td><td th:text="${row.serviceCode()}"></td><td th:text="${row.tranCode()}"></td><td th:text="${row.tranName()}"></td><td th:text="${row.moduleName()}"></td><td th:text="${row.soapFieldName()}"></td><td th:text="${row.fieldName()}"></td><td th:text="${row.mappingStatus()}"></td><td th:text="${row.origFieldValue()}"></td><td th:text="${row.destFieldValue()}"></td></tr></tbody></table></section>
</main></div></div><div th:replace="~{fragments/layout :: sidebarScript}"></div>
<script th:if="${command != null and (command.status() == 'PENDING' or command.status() == 'RUNNING')}" th:inline="javascript">(() => { const progressUrl = /*[[@{/report-exports/{batchId}/progress(batchId=${command.batchId()})}]]*/ ''; const intervalId = window.setInterval(() => fetch(progressUrl).then(response => response.json()).then((current) => { if (!current || current.status === 'SUCCEEDED' || current.status === 'FAILED') window.location.reload(); else document.querySelector('#report-export-status').textContent = current.status; }).catch(() => window.clearInterval(intervalId)), 3000); window.addEventListener('pagehide', () => window.clearInterval(intervalId)); })();</script>
</body></html>
